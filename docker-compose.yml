version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mining_dt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mining_dt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mining_dt"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mining_dt_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/mining_dt
      DEFAULT_RANDOM_SEED: 42
      SECRET_KEY: production_secret_key_mining_digital_twin_2026
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - .:/app

volumes:
  pgdata:
